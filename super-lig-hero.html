<script>
(function(){
"use strict";

/* =====================================================================
   FB HERO 2D — Kuş bakışı, Score!Hero mekanikli taktiksel futbol.
   State machine: AIMING -> BALL_MOVING -> RESOLVING
   Quadratic Bezier swipe, boşa kaçan oyuncular, kesme yapan defans.
   ===================================================================== */

// ---------------- CANVAS & KAMERA ----------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;

const WORLD_W = 1000, WORLD_H = 1500;
const VIEW_W  = 640;               // ekranda görünen dünya genişliği (temel)
let zoom = 1, baseZoom = 1, zoomT = 1;

const cam = { x: WORLD_W/2, y: WORLD_H - 300, tx: WORLD_W/2, ty: WORLD_H - 300 };

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseZoom = cw / VIEW_W;
  zoomT = baseZoom;
  zoom = baseZoom;
}
window.addEventListener('resize', resize);
resize();

function screenToWorld(sx, sy){
  return { x: cam.x + (sx - cw/2)/zoom, y: cam.y + (sy - ch/2)/zoom };
}
function clampCam(){
  const vw = cw/zoom, vh = ch/zoom;
  if(vw >= WORLD_W + 120) cam.x = WORLD_W/2;
  else cam.x = Math.max(vw/2 - 60, Math.min(WORLD_W - vw/2 + 60, cam.x));
  if(vh >= WORLD_H + 120) cam.y = WORLD_H/2;
  else cam.y = Math.max(vh/2 - 60, Math.min(WORLD_H - vh/2 + 60, cam.y));
}

// ---------------- SAHA GEOMETRİSİ ----------------
const GOAL_Y = 130;                // kale çizgisi (aşağı kaydırıldı — üstte nefes payı var)
const GOAL_X1 = 406, GOAL_X2 = 594;   // %10 geniş kale
const LINE = { l: 40, r: WORLD_W-40, t: GOAL_Y, b: WORLD_H-40 };

// ---------------- YARDIMCILAR ----------------
const rand = (a,b)=> a + Math.random()*(b-a);
const dist = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);
const lerp = (a,b,t)=> a + (b-a)*t;
function bez(p0,p1,p2,t){
  const u = 1-t;
  return { x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
           y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y };
}
function bezLen(p0,p1,p2){
  let L=0, prev=p0;
  for(let i=1;i<=20;i++){ const p=bez(p0,p1,p2,i/20); L+=dist(prev,p); prev=p; }
  return L;
}

// ---------------- OYUN DURUMU ----------------
const PLAYER_NAMES = ['KAAN','EMRE','BURAK','MERT','ARDA','CAN','YUSUF','ONUR','BARIŞ','DENİZ','KEREM','UMUT'];

// Süper Lig 2025-26 takımları (isim + iki forma rengi)
const TEAMS = [
  { name:'Galatasaray',    c1:'#FDB912', c2:'#A32638' },
  { name:'Fenerbahçe',     c1:'#ffd400', c2:'#0b2a6b' },
  { name:'Beşiktaş',       c1:'#111111', c2:'#ffffff' },
  { name:'Trabzonspor',    c1:'#841E3D', c2:'#5CC6F0' },
  { name:'Samsunspor',     c1:'#E30613', c2:'#ffffff' },
  { name:'Başakşehir',     c1:'#F26522', c2:'#14395C' },
  { name:'Eyüpspor',       c1:'#6A0DAD', c2:'#FFD700' },
  { name:'Göztepe',        c1:'#FFD200', c2:'#E30613' },
  { name:'Alanyaspor',     c1:'#FF7F00', c2:'#009150' },
  { name:'Antalyaspor',    c1:'#E30613', c2:'#ffffff' },
  { name:'Konyaspor',      c1:'#046A38', c2:'#ffffff' },
  { name:'Kasımpaşa',      c1:'#003399', c2:'#ffffff' },
  { name:'Ç. Rizespor',    c1:'#009150', c2:'#0033A0' },
  { name:'Gaziantep FK',   c1:'#E30613', c2:'#111111' },
  { name:'Kayserispor',    c1:'#FFD200', c2:'#E30613' },
  { name:'Kocaelispor',    c1:'#006B3F', c2:'#111111' },
  { name:'Gençlerbirliği', c1:'#E30613', c2:'#111111' },
  { name:'Karagümrük',     c1:'#B22222', c2:'#111111' }
];
let myTeam = TEAMS[0];   // takım seçim ekranında belirlenir

// Deterministik RNG — her bölüm BENZERSİZ ve her girişte aynı diziliş
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let state = 'MENU';        // 'MENU' | 'AIMING' | 'BALL_MOVING' | 'RESOLVING'
let mates = [], opps = [], keeper = null;
let holder = 0, passer = -1;
let score = 0;
let scenarioDef = null;    // pozisyonu baştan başlatabilmek için saklanır
let oppKit = TEAMS[1];     // rakip takım (bölüm başında seçilir)

// ------- BÖLÜM & AYAR SİSTEMİ -------
const TOTAL_LEVELS = 1000;
let currentLevel = 1;
let unlocked = 1;                          // açılan en yüksek bölüm
const doneLevels = new Set();              // tamamlananlar
const settings = { keeper: 1, ball: 1, vib: true };

function isFinal(i){ return i % 20 === 0; }               // 20, 40, 60 → SEZON FİNALİ 🏆
function isHard(i){ return i % 5 === 0 && !isFinal(i); }  // 5,10,15,25... → zor bölüm 🔥

function levelDiff(i){
  const hard = isHard(i), final = isFinal(i);
  // 1000 bölüme yayılan yumuşak ölçek: ilk 100 hızlı, sonrası logaritmik tırmanır
  const g = Math.min(i, 100) + (i > 100 ? Math.log2(i - 99) * 14 : 0);
  return {
    hard, final,
    mates: Math.min(6, 4 + (i > 20 ? 1 : 0) + ((hard||final) ? 1 : 0)),
    opps:  Math.min(14, 6 + Math.floor(g / 5) + (hard ? 2 : 0) + (final ? 4 : 0)),
    kSpeed: Math.min(228, (50 + g * 1.1 + (hard ? 15 : 0) + (final ? 32 : 0)) * 1.45) * settings.keeper,
    kSave:  Math.min(63,  (13 + g * 0.25 + (hard ? 4 : 0) + (final ? 8 : 0)) * 1.45) * settings.keeper,
    aware:  Math.min(215, 76 + g * 0.95 + (hard ? 12 : 0) + (final ? 20 : 0)),
    oSpeed: Math.min(235, 100 + g * 1.35 + (hard ? 13 : 0) + (final ? 24 : 0))
  };
}

// BÖLÜM TÜRÜ & GOL HEDEFİ: her bölüm 1-3 gol ister; bazıları PENALTI ya da FRİKİK
function levelMeta(i){
  const R = mulberry32(i * 911 + 13);
  let type = 'normal';
  if(!isFinal(i)){
    const r = R();
    if(r < 0.08) type = 'penalty';
    else if(r < 0.18) type = 'freekick';
  }
  const needed = type === 'normal' ? 1 + Math.floor(R()*3) : 1 + Math.floor(R()*2);
  return { type, needed };
}
let levelType = 'normal';
let goalsNeeded = 1, goalsScored = 0, curAttack = 0;
function updGoalHud(){
  document.getElementById('goalProg').textContent = goalsScored + '/' + goalsNeeded;
}

// ------- NADİRLİK SINIFLARI -------
const RAR = {
  s: { label:'SIRADAN',  c:'#8a9aae' },
  e: { label:'ENDER',    c:'#43a047' },
  n: { label:'NADİR',    c:'#1e88e5' },
  f: { label:'EFSANEVİ', c:'#ab47bc' },
  g: { label:'GİZEMLİ',  c:'#ff2d95' }
};

// ------- SAHA TEMALARI: MARKETTEN ALINIR, kuşanınca saha değişir -------
const THEMES = [
  { name:'Klasik Çim',   price:0,     r:'s', g1:'#2f9e44', g2:'#37b24d', line:'#ffffff', goal:'#ffffff', net:'rgba(255,255,255,0.6)' },
  { name:'Gece Maçı',    price:600,   r:'s', g1:'#1b5e30', g2:'#227a3c', line:'#e8f5e9', goal:'#ffd400', net:'rgba(255,212,0,0.55)' },
  { name:'Altın Saha',   price:1200,  r:'s', g1:'#2d8f3f', g2:'#0e7a2f', line:'#ffd400', goal:'#0b2a6b', net:'rgba(120,150,255,0.6)' },
  { name:'Kar Sahası',   price:2000,  r:'e', g1:'#cfd8dc', g2:'#b8c6cc', line:'#546e7a', goal:'#d32f2f', net:'rgba(211,47,47,0.5)' },
  { name:'Toprak Saha',  price:3000,  r:'e', g1:'#a97142', g2:'#b8814f', line:'#fff3e0', goal:'#37474f', net:'rgba(55,71,79,0.6)' },
  { name:'Turkuaz Arena',price:4500,  r:'e', g1:'#00897b', g2:'#00a48f', line:'#ffffff', goal:'#ffffff', net:'rgba(255,255,255,0.55)' },
  { name:'Mor Gece',     price:6500,  r:'n', g1:'#5e35b1', g2:'#6a3fc4', line:'#f3e5f5', goal:'#ffd400', net:'rgba(255,212,0,0.55)' },
  { name:'Gün Batımı',   price:9000,  r:'n', g1:'#7c8f2f', g2:'#8ba337', line:'#fff8e1', goal:'#ff9500', net:'rgba(255,149,0,0.55)' },
  { name:'Halı Saha',    price:12000, r:'n', g1:'#b71c1c', g2:'#c62828', line:'#ffffff', goal:'#ffffff', net:'rgba(255,255,255,0.55)' },

function saveGame(){
  try{
    localStorage.setItem('slhero_save', JSON.stringify({
      v:1, tokens, unlocked, score,
      done:[...doneLevels], owned:[...owned], oth:[...ownedThemes],
      eqBall, eqTheme, team: myTeam.name,
      set:{ keeper: settings.keeper, ball: settings.ball, vib: settings.vib },
      kIdx: keeperIdx, bIdx: ballIdx
    }));
  }catch(e){ /* depolama yoksa sessizce geç */ }
}
function loadGame(){
  try{
    const raw = localStorage.getItem('slhero_save');
    if(!raw) return false;
    const s = JSON.parse(raw);
    tokens = s.tokens || 0;
    unlocked = s.unlocked || 1;
    score = s.score || 0;
    (s.done  || []).forEach(x => doneLevels.add(x));
    (s.owned || []).forEach(x => owned.add(x));
    (s.oth   || []).forEach(x => ownedThemes.add(x));
    eqBall  = (s.eqBall  >= 0 && s.eqBall  < BALLS.length)  ? s.eqBall  : 0;
    eqTheme = (s.eqTheme >= 0 && s.eqTheme < THEMES.length) ? s.eqTheme : 0;
    theme = THEMES[eqTheme];
    if(s.set){
      settings.keeper = s.set.keeper ?? 1;
      settings.ball   = s.set.ball ?? 1;
      settings.vib    = s.set.vib ?? true;
    }
    keeperIdx = s.kIdx ?? 1;
    ballIdx   = s.bIdx ?? 1;
    const t = TEAMS.find(t => t.name === s.team);
    if(t){ myTeam = t; return true; }
    return false;
  }catch(e){ return false; }
}

const flight = { path:[], cum:[], total:0, s:0, speed:600, time:0,
                 rolling:false, loose:false, looseT:0, vx:0, vy:0 };

function pathPoint(s){
  const pts = flight.path, cum = flight.cum;
  let i = 1;
  while(i < cum.length && cum[i] < s) i++;
  if(i >= cum.length) return pts[pts.length-1];
  const seg = Math.max(cum[i] - cum[i-1], 0.001);
  const t = (s - cum[i-1]) / seg;
  return { x: lerp(pts[i-1].x, pts[i].x, t), y: lerp(pts[i-1].y, pts[i].y, t) };
}

function buildScenario(){
  hudAtk.textContent = currentLevel;
  theme = THEMES[eqTheme];   // saha görünümü marketten kuşanılan tema

  // BENZERSİZ: bölüm + atak numarası tohumlanır — her atak farklı diziliş
  const R = mulberry32(currentLevel * 1013904223 + curAttack * 7907 + 7919);
  const srand = (a,b) => a + R()*(b-a);

  // rakip: ligden kendi takımın DIŞINDA bir takım (bölüme sabit)
  let oi = Math.floor(R()*TEAMS.length);
  if(TEAMS[oi] === myTeam) oi = (oi+1) % TEAMS.length;
  oppKit = TEAMS[oi];

  const D = levelDiff(currentLevel);
  const names = PLAYER_NAMES.slice().sort(()=>R()-0.5);
  const def = { mates:[], opps:[], keeperX: srand(470,530), diff: D };

  if(levelType === 'penalty'){
    // ——— PENALTI: nokta atışı, sadece sen ve kaleci ———
    def.mates.push({ x: srand(485,515), y: GOAL_Y + 121, name: names[0] });
  }
  else if(levelType === 'freekick'){
    // ——— FRİKİK: baraj + kaleci ———
    const sx = srand(330,670), sy = GOAL_Y + srand(240,330);
    def.mates.push({ x: sx, y: sy, name: names[0] });
    // yan pas seçeneği için bir destek oyuncusu
    const side = sx < 500 ? 1 : -1;
    def.mates.push({
      x: Math.max(90, Math.min(910, sx + side*srand(150,230))),
      y: Math.max(GOAL_Y + 195, sy + srand(-30,50)),
      name: names[1]
    });
    // BARAJ: topla kale arasına dizilir
    const gx = 500, gy = GOAL_Y;
    const ddx = gx - sx, ddy = gy - sy;
    const L = Math.max(Math.hypot(ddx, ddy), 0.001);
    const ux = ddx/L, uy = ddy/L, pxn = -uy, pyn = ux;
    const wallN = 4 + Math.floor(R()*3);
    const bx = sx + ux*95, by = sy + uy*95;
    for(let k=0;k<wallN;k++){
      const off = (k - (wallN-1)/2) * 34;
      def.opps.push({ x: bx + pxn*off, y: by + pyn*off });
    }
  }
  else {
    // ——— NORMAL ATAK ———
    const n = D.mates;
    const startY = srand(1150, 1280);
    const endY   = srand(450, 550);   // hücumcular kaleye YANAŞMAZ — şut koridoru hep açık
    let side = R()<0.5 ? 1 : -1;

    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const y = lerp(startY, endY, t) + srand(-40,40);
      const x = i===0 ? srand(380,620) : 500 + side*srand(140,320) + srand(-30,30);
      side *= -1;
      def.mates.push({ x: Math.max(90, Math.min(910, x)), y, name: names[i % names.length] });
    }

    const oppCount = D.opps;
    for(let i=0;i<oppCount;i++){
      let x, y, ok=false, tries=0;
      while(!ok && tries<80){
        tries++;
        y = srand(endY-140, startY-60);
        x = srand(100, 900);
        ok = true;
        for(const m of def.mates){
          if(Math.hypot(m.x-x, m.y-y) < 100){ ok=false; break; }
        }
        for(const o of def.opps){
          if(Math.hypot(o.x-x, o.y-y) < 85){ ok=false; break; }
        }
      }
      def.opps.push({ x, y });
    }
  }
  scenarioDef = def;
  resetRound();
}

// ---------------- SWIPE & BEZIER GİRDİSİ ----------------
let touching = false;
let drawnPath = [];         // parmak kaydırma yolu (EKRAN koordinatları)
let swipeStart = null;      // parmağın ilk bastığı nokta — sabit çapa
let drawT0 = 0;             // fiske hızı için başlangıç zamanı

function ptOf(e){
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

function onDown(e){
  if(e.cancelable) e.preventDefault();
  if(state !== 'AIMING') return;
  touching = true;
  drawT0 = performance.now();
  curveSign = 0;             // her vuruşta falso yönü kilidi sıfırlanır
  liveGuide = null;
  swipeStart = ptOf(e);
  drawnPath = [swipeStart];
}
function onMove(e){
  if(e.cancelable) e.preventDefault();
  if(!touching || state !== 'AIMING') return;
  const p = ptOf(e);
  const last = drawnPath[drawnPath.length-1];
  if(Math.hypot(p.x-last.x, p.y-last.y) > 3) drawnPath.push(p);
  if(drawnPath.length > 240) drawnPath.splice(1, 1); // başlangıç çapası silinmez
  liveGuide = computeGuide();
}
function onUp(e){
  if(e.cancelable) e.preventDefault();
  if(!touching) return;
  touching = false;
  if(state !== 'AIMING'){ drawnPath = []; liveGuide = null; return; }
  const g = computeGuide();
  if(!g){
    // Kısa dokunuş = TIKLAMA: takım arkadaşını topa çağır/vazgeç
    const w = screenToWorld(swipeStart.x, swipeStart.y);
    for(let i=0;i<mates.length;i++){
      if(i === holder) continue;
      if(dist(w, mates[i]) < 55){
        mates[i].called = !mates[i].called;
        vib(30);
        break;
      }
    }
    drawnPath = []; liveGuide = null;
    return;
  }
  drawnPath = [];
  launchBall(g);
}

// ---------------- TOPU İTME (FLICK) + TEK FALSO ----------------
// Kaydırma vektörü topu iter: yön = kaydırma yönü, güç = kaydırma uzunluğu.
// Kavis, parmak yolunun yay şeklinden gelir ve İLK büküşte yönü kilitlenir —
// ters yöne ikinci falso (S çizimi) İMKANSIZ.
let curveSign = 0;    // 0: henüz falso yok, ±1: kilitli yön
let liveGuide = null; // ekranda görünen kılavuz {p0,p1,p2,power,slen}

function computeGuide(){
  if(!swipeStart || drawnPath.length < 1) return liveGuide;
  const s = swipeStart, e = drawnPath[drawnPath.length-1];
  const sdx = e.x - s.x, sdy = e.y - s.y;
  const slen = Math.hypot(sdx, sdy);
  if(slen < 24) return liveGuide;   // titreme eşiği: kılavuz geri kaçmaz

  const ux = sdx/slen, uy = sdy/slen;
  const power = Math.min(slen, 340) / 340;          // 0..1
  const reach = 180 + power * 640;                   // dünya px menzil
  const p0 = { x: ball.x, y: ball.y };
  const p2 = {
    x: Math.max(20, Math.min(WORLD_W-20, p0.x + ux*reach)),
    y: Math.max(0,  Math.min(WORLD_H-20, p0.y + uy*reach))
  };

  // parmak yolunun düz çizgiden en büyük İMZALI sapması (kavis)
  let best = 0;
  for(const p of drawnPath){
    const vx = p.x - s.x, vy = p.y - s.y;
    const cross = vx*uy - vy*ux;
    if(Math.abs(cross) > Math.abs(best)) best = cross;
  }
  // TEK FALSO KURALI: yön ilk büküşte kilitlenir
  if(curveSign === 0 && Math.abs(best) > 14) curveSign = Math.sign(best);
  let mag = 0;
  if(curveSign !== 0 && Math.sign(best) === curveSign){
    mag = Math.min(Math.abs(best)/zoom * 1.6, reach * 0.45);
  }
  const p1 = {
    x: (p0.x+p2.x)/2 + uy * curveSign * mag,
    y: (p0.y+p2.y)/2 - ux * curveSign * mag
  };
  return { p0, p1, p2, power, slen };
}

// ---------------- OFSAYT ----------------
function offsideLineY(){
  const ys = opps.map(o => o.y);
  ys.push(keeper ? keeper.y : GOAL_Y);
  ys.sort((a,b) => a - b);
  return ys.length > 1 ? ys[1] : ys[0];   // sondan İKİNCİ savunmacı
}

// ---------------- TOPUN FIRLATILMASI ----------------
function launchBall(g){
  // bezier'i yol noktalarına örnekle — top tek kavisli bu rotayı izler
  const pts = [];
  for(let i=0;i<=48;i++) pts.push(bez(g.p0, g.p1, g.p2, i/48));
  flight.path = pts;
  flight.cum = [0];
  let L = 0;
  for(let i=1;i<pts.length;i++){ L += dist(pts[i-1], pts[i]); flight.cum.push(L); }
  flight.total = L;
  // Fiske (flick) hızı: kaydırmanın hızı topun sertliğini belirler — HIZLI TOP
  const drawTime = Math.max((performance.now() - drawT0)/1000, 0.08);
  const flick = (g.slen / zoom) / drawTime;
  flight.speed = Math.max(340, Math.min(820, flick * 0.8)) * settings.ball;
  flight.v = flight.speed * 1.12;          // vuruş anındaki ilk hız
  flight.s = 0; flight.time = 0;
  flight.rolling = false;
  flight.loose = false;
  flight.looseT = 0;
  passer = holder;
  // OFSAYT: pas ANINDA sondan ikinci savunmacıyı geçmiş olanlar bayraklanır
  const offLine = offsideLineY();
  mates.forEach((m,i)=>{
    m.off = (i !== holder) && m.y < offLine - 2 && m.y < ball.y - 2 && m.y < 770;
  });
  // ATAK ÇEŞİTLİLİĞİ: pas çıkar çıkmaz topsuz oyuncular BOŞA KOŞAR
  // (ileri + yana rastgele koşu; top yakınlarına gelirse koşuyu bırakıp topa giderler)
  mates.forEach((m,i)=>{
    if(i === holder){ m.runTo = null; return; }
    m.runTo = {
      x: Math.max(70, Math.min(930, m.x + rand(-130, 130))),
      y: Math.max(GOAL_Y + 195, Math.min(WORLD_H - 80, m.y - rand(80, 190)))
    };
  });
  drawnPath = [];
  liveGuide = null;
  state = 'BALL_MOVING';
}

// ---------------- GOL ALEVLERİ (PARTİKÜL SİSTEMİ) ----------------
const parts = [];
function spawnGoalFX(){
  const spots = [
    { x: GOAL_X1, y: GOAL_Y },            // sol direk dibi
    { x: GOAL_X2, y: GOAL_Y },            // sağ direk dibi
    { x: ball.x,  y: Math.max(ball.y, GOAL_Y-30) } // topun ağlarla buluştuğu yer
  ];
  const colors = ['#ffd400','#ff9500','#ff4d00','#ff2200','#fff4c1'];
  for(const sp of spots){
    for(let i=0;i<36;i++){
      const a = -Math.PI/2 + rand(-1.2, 1.2);      // alevler yukarı fışkırır
      const v = rand(90, 380);
      parts.push({
        x: sp.x + rand(-8,8), y: sp.y + rand(-4,4),
        vx: Math.cos(a)*v, vy: Math.sin(a)*v,
        life: rand(0.6, 1.6), age: 0,
        r: rand(3, 7),
        c: colors[Math.floor(Math.random()*colors.length)]
      });
    }
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.age += dt;
    if(p.age > p.life){ parts.splice(i,1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 260 * dt;                    // kıvılcımlar süzülerek düşer
    p.vx *= Math.pow(0.45, dt);
    p.vy *= Math.pow(0.6, dt);
  }
}
function drawParts(){
  if(!parts.length) return;
  for(const p of parts){
    const a = 1 - p.age/p.life;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1 + p.age*1.6), 0, Math.PI*2);
    ctx.fillStyle = p.c;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------------- SONUÇ / RESOLVING ----------------
function resolve(main, sub, kind){
  // kind: 'goal' | 'fail'
  state = 'RESOLVING';
  msgMain.textContent = main;
  msgMain.style.color = kind==='goal' ? '#ffd400' : '#ff5252';
  msgSub.textContent = sub || '';
  msgBox.classList.add('show');
  if(kind==='goal'){
    score++;
    goalsScored++;
    updGoalHud();
    const D = scenarioDef.diff;
    const reward = 15 + Math.floor(currentLevel/2) + (D.final ? 50 : (D.hard ? 15 : 0));
    addTokens(reward);
    if(goalsScored < goalsNeeded){
      msgMain.textContent = 'GOL! ' + goalsScored + '/' + goalsNeeded;
      msgSub.textContent = (sub || '') + '  💰 +' + reward + ' FB — devam!';
    } else {
      msgSub.textContent = (sub || '') + '  💰 +' + reward + ' FB';
    }
    vib([80,60,160]);
  } else {
    vib(50);
  }
  setTimeout(()=>{
    msgBox.classList.remove('show');
    if(kind==='goal'){
      if(goalsScored >= goalsNeeded){
        doneLevels.add(currentLevel);
        if(currentLevel >= unlocked && currentLevel < TOTAL_LEVELS) unlocked = currentLevel + 1;
        saveGame();
        levelComplete();
      } else {
        curAttack++;          // aynı bölümde SIRADAKİ atak (yine benzersiz)
        buildScenario();
      }
    }
    else resetRound();               // tur baştan başlar
  }, kind==='goal' ? 1800 : 1400);
}

// ---------------- GÜNCELLEME ----------------
let ballVX = 0, ballVY = 0;   // savunma tahmini için top hız vektörü

function updateOpps(dt){
  for(const o of opps){
    if(state === 'BALL_MOVING'){
      // ZEKİ SAVUNMA: topun 0.5 sn sonraki TAHMİNİ konumunu keser
      const px = ball.x + ballVX * 0.5;
      const py = ball.y + ballVY * 0.5;
      const d = Math.max(Math.hypot(px - o.x, py - o.y), 0.001);
      if(d < o.aware){
        o.lunging = true;
        o.x += (px - o.x)/d * o.speed * dt;
        o.y += (py - o.y)/d * o.speed * dt;
      }
    }
  }
}

// ADAM ADAMA MARKAJ: nişan alırken savunma boştaki hücumcuların üstüne gider.
// Her savunmacı en yakın boş Fenerbahçeliyi kapar, kaleyle arasına girer —
// kimse rahat rahat boşta bekleyemez!
function updateMarking(dt){
  if(levelType !== 'normal') return;   // penaltı/frikikte baraj yerinden oynamaz
  const taken = new Set();
  for(const o of opps){
    let bi = -1, bd = 1e9;
    mates.forEach((m, i)=>{
      if(i === holder || taken.has(i)) return;
      const d = dist(o, m);
      if(d < bd){ bd = d; bi = i; }
    });
    if(bi < 0 || bd > 380){
      // tutacak adam yok: yerine yavaşça dön
      o.x = lerp(o.x, o.hx, 1 - Math.pow(0.1, dt));
      o.y = lerp(o.y, o.hy, 1 - Math.pow(0.1, dt));
      continue;
    }
    taken.add(bi);
    const m = mates[bi];
    // hedef nokta: hücumcunun 52px kale tarafı — pas yolunu keser
    const gx = WORLD_W/2, gy = GOAL_Y;
    const dx = gx - m.x, dy = gy - m.y;
    const L = Math.max(Math.hypot(dx, dy), 0.001);
    const tx = Math.max(60, Math.min(940, m.x + dx/L * 52));
    const ty = Math.max(GOAL_Y + 30, m.y + dy/L * 52);
    const d2 = Math.max(Math.hypot(tx - o.x, ty - o.y), 0.001);
    if(d2 > 5){
      const sp = Math.min(o.speed * 0.6, 126);
      o.x += (tx - o.x)/d2 * sp * dt;
      o.y += (ty - o.y)/d2 * sp * dt;
    }
  }
}

function updateKeeper(dt){
  // ÇOK ZEKİ KALECİ: topun kale çizgisine VARIŞ noktasını yörüngeden çözer
  let anticX;
  if(ballVY < -40){
    // top kaleye doğru geliyor: çizgiye ulaşma süresi → o andaki x
    const tHit = (keeper.y - ball.y) / ballVY;
    anticX = (tHit > 0 && tHit < 1.4)
      ? ball.x + ballVX * tHit
      : ball.x + ballVX * 0.3;
  } else {
    anticX = ball.x + ballVX * 0.3;   // yoksa kısa vadeli tahmin
  }
  const targetX = Math.max(GOAL_X1+18, Math.min(GOAL_X2-18, anticX));
  const diff = targetX - keeper.x;
  const step = Math.max(-keeper.speed*dt, Math.min(keeper.speed*dt, diff * 2.2 * dt * 10));
  keeper.x += Math.max(-keeper.speed*dt, Math.min(keeper.speed*dt, step));
}

function updateBall(dt){
  const prevBX = ball.x, prevBY = ball.y;
  ball.trail.push({x:ball.x, y:ball.y});
  if(ball.trail.length > 14) ball.trail.shift();
  spawnBallFX(dt);

  flight.time += dt;
  if(!flight.rolling){
    // gerçekçi vuruş: top hızlı çıkar, yol boyunca yavaşlar
    flight.v = Math.max(flight.v * Math.pow(0.62, dt), flight.speed * 0.55);
    flight.s += flight.v * dt;
    if(flight.s >= flight.total){
      // rota bitti — son yön boyunca yavaşlayarak yuvarlan
      const pts = flight.path;
      const a = pts.length > 1 ? pts[pts.length-2] : pts[0];
      const b = pts[pts.length-1];
      const d = Math.max(dist(a,b), 0.001);
      const sp = flight.v * 0.5;
      flight.vx = (b.x-a.x)/d * sp;
      flight.vy = (b.y-a.y)/d * sp;
      flight.rolling = true;
      ball.x = b.x; ball.y = b.y;
    } else {
      const p = pathPoint(flight.s);
      ball.x = p.x; ball.y = p.y;
    }
  } else {
    ball.x += flight.vx * dt;
    ball.y += flight.vy * dt;
    flight.vx *= Math.pow(0.5, dt);
    flight.vy *= Math.pow(0.5, dt);
    // top yavaşladı ve boşta: sahiplenme yarışı başlar
    if(!flight.loose && Math.hypot(flight.vx, flight.vy) < 130){
      flight.loose = true; flight.looseT = 0;
    }
  }

  // top hız vektörü (savunma tahmini için)
  if(dt > 0){ ballVX = (ball.x - prevBX)/dt; ballVY = (ball.y - prevBY)/dt; }

  // --- BOŞ TOP: yakındaki oyuncular topa koşar (UZAKSA KOŞAMAZLAR) ---
  if(flight.loose){
    flight.looseT += dt;
    let bm = null, bd = 1e9;
    for(const m of mates){ const d = dist(m, ball); if(d < bd){ bd = d; bm = m; } }
    if(bm && bd < 430){                       // menzil dışıysa kimse yetişemez
      const d = Math.max(bd, 0.001);
      const sp = bm.called ? 250 : 220;
      bm.x += (ball.x - bm.x)/d * sp * dt;
      bm.y = Math.max(GOAL_Y + 185, bm.y + (ball.y - bm.y)/d * sp * dt);
    }
    let bo = null, od = 1e9;
    for(const o of opps){ const d = dist(o, ball); if(d < od){ od = d; bo = o; } }
    if(bo && od < 420){                       // savunma daha geniş menzilden gelir (zeki)
      const d = Math.max(od, 0.001);
      bo.lunging = true;
      bo.x += (ball.x - bo.x)/d * 130 * dt;
      bo.y += (ball.y - bo.y)/d * 130 * dt;
    }
    if(flight.looseT > 3.2){
      resolve('POZİSYON KAÇTI', 'Top çok uzağa gitti — kimse yetişemedi', 'fail'); return;
    }
  }

  // --- GOL / AUT kontrolü ---
  if(ball.y <= GOAL_Y){
    if(ball.x > GOAL_X1 && ball.x < GOAL_X2){
      if(dist(ball, keeper) < keeper.saveR + ball.r){
        resolve('POZİSYON KAÇTI', 'Kaleci son anda kurtardı!', 'fail'); return;
      }
      spawnGoalFX();
      resolve('GOOOL!', 'Ağlarla buluştu! 💛💙', 'goal'); return;
    }
    resolve('POZİSYON KAÇTI', 'Top kale dışına gitti', 'fail'); return;
  }
  if(ball.x < LINE.l-10 || ball.x > LINE.r+10 || ball.y > LINE.b+10){
    resolve('POZİSYON KAÇTI', 'Top taca çıktı', 'fail'); return;
  }

  // --- Kaleci gövde kurtarışı ---
  if(dist(ball, keeper) < keeper.saveR + ball.r){
    resolve('POZİSYON KAÇTI', 'Kaleci topu kaptı!', 'fail'); return;
  }

  // --- Rakip kesmesi (interception) ---
  for(const o of opps){
    if(dist(ball, o) < o.r + ball.r - 6){
      resolve('POZİSYON KAÇTI', oppKit.name + ' topu kesti!', 'fail'); return;
    }
  }

  // --- FB oyuncuları TOPUN GELECEĞİ NOKTAYA koşar (ara paslara yetişirler) ---
  // Şut bölgesinde asla: gol vuruşunu takım arkadaşı çalamaz!
  const shotZone = ball.y < GOAL_Y + 180;
  if(!shotZone){
    // topun ~0.55 sn sonraki tahmini konumu — koşu yoluna atılan pası karşılarlar
    const fx2 = ball.x + ballVX * 0.55;
    const fy2 = ball.y + ballVY * 0.55;
    for(let i=0;i<mates.length;i++){
      if(!flight.loose && i === passer) continue;
      const m = mates[i];
      const dNow = dist(m, ball);
      const dFut = Math.hypot(fx2 - m.x, fy2 - m.y);
      // ÇAĞRILAN oyuncu (tıklanan) çok daha uzaktan ve hızlı koşar
      const range = m.called ? 520 : 340;
      const sp    = m.called ? 240 : 210;
      if(Math.min(dNow, dFut) < range && dNow > 1){
        // TOP MENZİLDE: koşuyu bırak, topa git
        const tx = dFut < dNow ? fx2 : ball.x;
        const ty = dFut < dNow ? fy2 : ball.y;
        const dd = Math.max(Math.hypot(tx - m.x, ty - m.y), 0.001);
        m.x = Math.max(60, Math.min(940, m.x + (tx - m.x)/dd * sp * dt));
        m.y = Math.max(GOAL_Y + 185, Math.min(WORLD_H-60, m.y + (ty - m.y)/dd * sp * dt));
      } else if(m.runTo && !flight.loose){
        // TOP UZAKTA: boşa koşmaya devam — atak şekilleniyor
        const dr = Math.hypot(m.runTo.x - m.x, m.runTo.y - m.y);
        if(dr > 6){
          m.x += (m.runTo.x - m.x)/dr * 155 * dt;
          m.y += (m.runTo.y - m.y)/dr * 155 * dt;
        } else {
          m.runTo = null;   // koşu tamamlandı, boşta bekle
        }
      }
    }
  }

  // --- Takım arkadaşı topu aldı ---
  if(flight.time > 0.12 && !shotZone){
    for(let i=0;i<mates.length;i++){
      if(!flight.loose && i === passer) continue;   // boş topu pası atan da alabilir
      const m = mates[i];
      if(dist(ball, m) < m.r + ball.r + 10){
        if(m.off){
          resolve('OFSAYT!', 'Pas anında çizgiyi geçmişti — bayrak kalktı 🚩', 'fail');
          return;
        }
        holder = i;
        passer = -1;
        mates.forEach(mm => { mm.off = false; mm.called = false; });
        ball.x = m.x + 14; ball.y = m.y - 6;
        addTokens(2);                        // 💰 pas ödülü (zor kazanılır)
        state = 'AIMING';
        return;
      }
    }
  }

}

function updateCamera(dt){
  if(state === 'AIMING'){
    // tüm FB oyuncuları + top ekrana sığsın — pas hedefi asla kadraj dışı kalmasın
    let minx = ball.x, maxx = ball.x, miny = ball.y, maxy = ball.y;
    for(const m of mates){
      minx = Math.min(minx, m.x); maxx = Math.max(maxx, m.x);
      miny = Math.min(miny, m.y); maxy = Math.max(maxy, m.y);
    }
    // top şut menzilindeyse KALE de mutlaka kadrajda olsun
    if(ball.y < GOAL_Y + 700){
      minx = Math.min(minx, GOAL_X1 - 30);
      maxx = Math.max(maxx, GOAL_X2 + 30);
      miny = Math.min(miny, GOAL_Y - 55);
    }
    const padX = 110, padTop = 190, padBot = 120; // üstte skorboard payı
    const needW = (maxx - minx) + padX*2;
    const needH = (maxy - miny) + padTop + padBot;
    zoomT = Math.min(baseZoom, cw/needW, ch/needH);
    zoomT = Math.max(zoomT, baseZoom * 0.38);
    cam.tx = (minx + maxx) / 2;
    cam.ty = (miny + maxy) / 2 - (padTop - padBot) / 2 * 0.3;
  } else {
    zoomT = baseZoom;
    cam.tx = ball.x; cam.ty = ball.y;
  }
  const k = 1 - Math.pow(0.003, dt);   // smooth damp
  zoom = lerp(zoom, zoomT, k);
  cam.x = lerp(cam.x, cam.tx, k);
  cam.y = lerp(cam.y, cam.ty, k);
  clampCam();
}

// ---------------- ÇİZİM ----------------
function drawField(){
  // çim şeritleri (temaya göre)
  for(let y=0; y<WORLD_H; y+=100){
    ctx.fillStyle = (y/100)%2===0 ? theme.g1 : theme.g2;
    ctx.fillRect(-80, y, WORLD_W+160, 100);
  }
  ctx.strokeStyle = theme.line;
  ctx.lineWidth = 4;
  // dış çizgiler
  ctx.strokeRect(LINE.l, LINE.t, LINE.r-LINE.l, LINE.b-LINE.t);
  // orta çizgi ve yuvarlak
  ctx.beginPath(); ctx.moveTo(LINE.l, 770); ctx.lineTo(LINE.r, 770); ctx.stroke();
  ctx.beginPath(); ctx.arc(WORLD_W/2, 770, 92, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(WORLD_W/2, 770, 5, 0, Math.PI*2); ctx.fillStyle=theme.line; ctx.fill();
  // ceza sahası (üst)
  ctx.strokeRect(290, GOAL_Y, 420, 150);
  ctx.strokeRect(390, GOAL_Y, 220, 65);
  ctx.beginPath(); ctx.arc(WORLD_W/2, GOAL_Y+103, 12, 0, Math.PI*2); ctx.fillStyle=theme.line; ctx.fill();
  ctx.beginPath(); ctx.arc(WORLD_W/2, GOAL_Y+150, 70, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  // alt ceza sahası
  ctx.strokeRect(290, LINE.b-150, 420, 150);
  ctx.strokeRect(390, LINE.b-65, 220, 65);
  // KALE: direkler + file (temaya göre)
  const NET_D = 38; // file derinliği
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(GOAL_X1, GOAL_Y-NET_D, GOAL_X2-GOAL_X1, NET_D);
  ctx.strokeStyle = theme.net;
  ctx.lineWidth = 1.5;
  for(let x=GOAL_X1; x<=GOAL_X2; x+=14){ ctx.beginPath(); ctx.moveTo(x,GOAL_Y-NET_D); ctx.lineTo(x,GOAL_Y); ctx.stroke(); }
  for(let y=GOAL_Y-NET_D; y<=GOAL_Y; y+=12){ ctx.beginPath(); ctx.moveTo(GOAL_X1,y); ctx.lineTo(GOAL_X2,y); ctx.stroke(); }
  // belirgin kale çerçevesi: koyu kontur + kalın direk + yuvarlak direk başları
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(GOAL_X1, GOAL_Y); ctx.lineTo(GOAL_X1, GOAL_Y-NET_D-2); ctx.lineTo(GOAL_X2, GOAL_Y-NET_D-2); ctx.lineTo(GOAL_X2, GOAL_Y); ctx.stroke();
  ctx.strokeStyle = theme.goal; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(GOAL_X1, GOAL_Y); ctx.lineTo(GOAL_X1, GOAL_Y-NET_D-2); ctx.lineTo(GOAL_X2, GOAL_Y-NET_D-2); ctx.lineTo(GOAL_X2, GOAL_Y); ctx.stroke();
  for(const px of [GOAL_X1, GOAL_X2]){
    ctx.beginPath(); ctx.arc(px, GOAL_Y, 7, 0, Math.PI*2);
    ctx.fillStyle = theme.goal; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.stroke();
  }
}

function drawFBPlayer(m, isHolder, now){
  // seçili halkası
  if(isHolder && state==='AIMING'){
    const pr = 24 + Math.sin(now*0.006)*3;
    ctx.beginPath(); ctx.arc(m.x, m.y, pr, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(124,252,0,0.9)'; ctx.lineWidth = 3; ctx.stroke();
  }
  // ÇAĞRILDI halkası: pastan sonra topa koşacak
  if(m.called){
    ctx.beginPath(); ctx.arc(m.x, m.y, 26, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,229,255,0.9)'; ctx.lineWidth = 3;
    ctx.setLineDash([6,5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
    ctx.fillStyle = '#00e5ff';
    ctx.fillText('KOŞ!', m.x, m.y - m.r - 12);
  }
  // gölge
  ctx.beginPath(); ctx.arc(m.x+2, m.y+3, m.r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
  // çubuklu forma: SEÇİLEN TAKIMIN renkleri
  ctx.save();
  ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.clip();
  const stripes = 6, sw = (m.r*2)/stripes;
  for(let i=0;i<stripes;i++){
    ctx.fillStyle = i%2===0 ? myTeam.c1 : myTeam.c2;
    ctx.fillRect(m.x - m.r + i*sw, m.y - m.r, sw+0.5, m.r*2);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2.5; ctx.stroke();
  // isim
  ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillText(m.name, m.x+1, m.y + m.r + 15);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(m.name, m.x, m.y + m.r + 14);
}

function drawArrow(from, to){
  const d = dist(from, to);
  if(d < 6) return;
  const ux = (to.x-from.x)/d, uy = (to.y-from.y)/d;
  const sx = from.x + ux*22, sy = from.y + uy*22;
  ctx.strokeStyle = 'rgba(124,252,0,0.75)';
  ctx.lineWidth = 3;
  ctx.setLineDash([7,6]);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(to.x, to.y); ctx.stroke();
  ctx.setLineDash([]);
  // ok başı
  ctx.fillStyle = 'rgba(124,252,0,0.9)';
  ctx.beginPath();
  ctx.moveTo(to.x + ux*10, to.y + uy*10);
  ctx.lineTo(to.x - uy*6, to.y + ux*6);
  ctx.lineTo(to.x + uy*6, to.y - ux*6);
  ctx.closePath(); ctx.fill();
}

function drawAimGuide(){
  const g = liveGuide;
  if(!g) return;
  ctx.strokeStyle = '#ffd400';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.setLineDash([12, 10]);
  ctx.beginPath();
  ctx.moveTo(g.p0.x, g.p0.y);
  ctx.quadraticCurveTo(g.p1.x, g.p1.y, g.p2.x, g.p2.y);
  ctx.stroke();
  ctx.setLineDash([]);
  // varış noktası
  ctx.beginPath(); ctx.arc(g.p2.x, g.p2.y, 9, 0, Math.PI*2);
  ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(g.p2.x, g.p2.y, 3, 0, Math.PI*2);
  ctx.fillStyle = '#ffd400'; ctx.fill();
  // falso yönü kilitliyse göster
  if(curveSign !== 0){
    ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,212,0,0.85)';
    ctx.fillText(curveSign > 0 ? '↷ FALSO' : '↶ FALSO', g.p1.x, g.p1.y - 10);
  }
}

// Kuşanılan topun uçuş efektleri: kıvılcım / alev / gökkuşağı izi
let fxAcc = 0;
function spawnBallFX(dt){
  const b = BALLS[eqBall];
  if(!b.fx.spark && !b.fx.fire) return;
  fxAcc += dt;
  if(fxAcc < 0.03) return;
  fxAcc = 0;
  if(b.fx.spark){
    parts.push({
      x: ball.x + rand(-4,4), y: ball.y + rand(-4,4),
      vx: rand(-40,40), vy: rand(-40,40),
      life: rand(0.25,0.5), age: 0, r: rand(1.5,3),
      c: sparkColor(b.fx.spark)
    });
  }
  if(b.fx.fire){
    parts.push({
      x: ball.x + rand(-3,3), y: ball.y + rand(-3,3),
      vx: -ballVX*0.12 + rand(-15,15), vy: -ballVY*0.12 + rand(-15,15),
      life: rand(0.3,0.6), age: 0, r: rand(3,6),
      c: ['#ff6d00','#ff9500','#ffd400','#ff2200'][Math.floor(Math.random()*4)]
    });
  }
}

function drawBall(){
  const b = BALLS[eqBall];
  const body = ballBody();
  // iz — top rengiyle
  for(let i=0;i<ball.trail.length;i++){
    const t = ball.trail[i];
    ctx.globalAlpha = i/ball.trail.length * 0.4;
    ctx.beginPath(); ctx.arc(t.x, t.y, ball.r*(0.4 + i/ball.trail.length*0.5), 0, Math.PI*2);
    ctx.fillStyle = body; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // parlama halesi
  if(b.fx.glow){
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r*2.1, 0, Math.PI*2);
    ctx.fillStyle = b.fx.glow;
    ctx.globalAlpha = 0.22 + Math.sin(performance.now()*0.008)*0.08;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // gölge + gövde
  ctx.beginPath(); ctx.arc(ball.x+2, ball.y+3, ball.r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = body; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = ballAccent(); ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r*0.4, 0, Math.PI*2);
  ctx.fillStyle = ballAccent(); ctx.fill();
}

function render(now){
  ctx.fillStyle = '#071c10';
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(cw/2, ch/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-cam.x, -cam.y);

  drawField();

  opps.forEach(drawOpp);
  drawKeeper();
  mates.forEach((m,i)=> drawFBPlayer(m, i===holder, now));

  if(state === 'AIMING') {} // kılavuz çizgisi YOK — saf fiske, Score!Hero usulü
  drawBall();
  drawParts();

  ctx.restore();
}

// ---------------- ANA DÖNGÜ ----------------
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;

  if(state === 'BALL_MOVING'){
    updateOpps(dt);
    updateKeeper(dt);
    updateBall(dt);
  } else if(state === 'AIMING'){
    updateMarking(dt);
  }

  updateParts(dt);
  updateCamera(dt);
  render(now);
}

// ---------------- MENÜ & BÖLÜM YÖNETİMİ ----------------
const screens = { teamSel: document.getElementById('teamSel'),
                  menu: document.getElementById('menu'),
                  levels: document.getElementById('levels'),
                  settings: document.getElementById('settings'),
                  shop: document.getElementById('shop'),
                  lvlDone: document.getElementById('lvlDone') };

function showScreen(name){
  for(const k in screens) screens[k].classList.toggle('show', k === name);
  if(name){ state = 'MENU'; touching = false; drawnPath = []; liveGuide = null; }
}

// ------- TAKIM SEÇİMİ -------
function applyTeam(t){
  myTeam = t;
  document.documentElement.style.setProperty('--tc1', t.c1);
  document.documentElement.style.setProperty('--tc2', t.c2);
  document.getElementById('teamTag').textContent = t.name.toUpperCase() + ' İLE ŞAMPİYONLUĞA';
  saveGame();
}
function buildTeamGrid(){
  const grid = document.getElementById('teamGrid');
  grid.innerHTML = '';
  TEAMS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'teamBtn';
    const dot = document.createElement('span');
    dot.className = 'tDot';
    dot.style.background = t.c1;
    dot.style.borderColor = t.c2;
    b.appendChild(dot);
    b.appendChild(document.createTextNode(t.name));
    b.addEventListener('click', ()=>{
      applyTeam(t);
      buildScenario();       // formalar ve rakip yeni takıma göre
      showScreen('menu');
      vib(40);
    });
    grid.appendChild(b);
  });
}

// ------- BÖLÜM EKRANI: sadece MEVCUT bölüm görünür -------
function buildLevelInfo(){
  const i = unlocked;
  const meta = levelMeta(i);
  document.getElementById('lvlNum').textContent = 'BÖLÜM ' + i;
  const tip = meta.type === 'penalty' ? '⚡ PENALTI' : meta.type === 'freekick' ? '🧱 FRİKİK' : '⚽ ATAK';
  let extra = '';
  if(isFinal(i)) extra = ' • 🏆 SEZON FİNALİ';
  else if(isHard(i)) extra = ' • 🔥 ZOR BÖLÜM';
  document.getElementById('lvlInfo').textContent = tip + ' • ' + meta.needed + ' GOL' + extra;
}
document.getElementById('btnStart').addEventListener('click', ()=> startLevel(unlocked));

// ------- MARKET: TOPLAR + SAHALAR, NADİRLİK ROZETLİ -------
function shopRow(item, i, isTheme){
  const isEq = isTheme ? (eqTheme === i) : (eqBall === i);
  const has  = isTheme ? ownedThemes.has(i) : owned.has(i);
  const row = document.createElement('div');
  row.className = 'shopRow' + (isEq ? ' eq' : '');
  const prev = document.createElement('div');
  if(isTheme){
    prev.className = 'tPrev';
    prev.style.background = 'linear-gradient(135deg,' + item.g1 + ' 50%,' + item.g2 + ' 50%)';
    prev.style.borderColor = item.line;
  } else {
    prev.className = 'bPrev';
    const c1 = item.c1 === 'team' ? myTeam.c1 : item.c1;
    prev.style.background = c1 === 'rainbow'
      ? 'conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)' : c1;
    prev.style.borderColor = item.c2 === 'team2' ? myTeam.c2 : item.c2;
    if(item.fx && item.fx.glow) prev.style.boxShadow = '0 0 12px ' + item.fx.glow;
  }
  const nm = document.createElement('div');
  nm.className = 'bName';
  const rr = RAR[item.r];
  nm.innerHTML = item.name + '<small>' + (item.d || 'Saha görünümü') + '</small>' +
    '<span class="rar" style="background:' + rr.c + '">' + rr.label + '</span>';
  const btn = document.createElement('button');
  btn.className = 'bBuy';
  if(isEq){
    btn.textContent = '✓ SEÇİLİ'; btn.classList.add('eq');
  } else if(has){
    btn.textContent = 'KUŞAN'; btn.classList.add('owned');
    btn.addEventListener('click', ()=>{
      if(isTheme){ eqTheme = i; theme = THEMES[i]; } else { eqBall = i; }
      saveGame();
      buildShop();
    });
  } else if(tokens >= item.price){
    btn.textContent = '💰 ' + item.price;
    btn.addEventListener('click', ()=>{
      if(isTheme){ ownedThemes.add(i); eqTheme = i; theme = THEMES[i]; }
      else { owned.add(i); eqBall = i; }
      addTokens(-item.price);   // saveGame'i de tetikler
      vib(60);
      buildShop();
    });
  } else {
    btn.textContent = '💰 ' + item.price; btn.classList.add('cant');
  }
  row.appendChild(prev); row.appendChild(nm); row.appendChild(btn);
  return row;
}

const RAR_ORD = { s:0, e:1, n:2, f:3, g:4 };
function buildShop(){
  document.getElementById('shopTokVal').textContent = tokens;
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  const h1 = document.createElement('div');
  h1.className = 'shopSec'; h1.textContent = '⚽ TOPLAR';
  list.appendChild(h1);
  BALLS.map((b,i)=>({b,i}))
    .sort((a,c)=> (RAR_ORD[a.b.r]-RAR_ORD[c.b.r]) || (a.b.price - c.b.price))
    .forEach(({b,i})=> list.appendChild(shopRow(b, i, false)));
  const h2 = document.createElement('div');
  h2.className = 'shopSec'; h2.textContent = '🏟️ SAHALAR';
  list.appendChild(h2);
  THEMES.map((t,i)=>({t,i}))
    .sort((a,c)=> (RAR_ORD[a.t.r]-RAR_ORD[c.t.r]) || (a.t.price - c.t.price))
    .forEach(({t,i})=> list.appendChild(shopRow(t, i, true)));
}

function startLevel(i){
  currentLevel = i;
  const meta = levelMeta(i);
  levelType = meta.type;
  goalsNeeded = meta.needed;
  goalsScored = 0;
  curAttack = 0;
  updGoalHud();
  buildScenario();     // her bölüm benzersiz: kendi tohumundan üretilir
  showScreen(null);
  state = 'AIMING';
  // penaltı/frikik bölümü duyurusu (oyunu durdurmaz)
  if(levelType !== 'normal'){
    msgMain.textContent = levelType === 'penalty' ? '⚡ PENALTI!' : '🧱 FRİKİK!';
    msgMain.style.color = '#00e5ff';
    msgSub.textContent = goalsNeeded > 1 ? goalsNeeded + ' gol gerekiyor!' : '';
    msgBox.classList.add('show');
    setTimeout(()=> msgBox.classList.remove('show'), 1100);
  }
}

function levelComplete(){
  let t;
  if(isFinal(currentLevel)){
    t = '🏆 SEZON ' + (currentLevel/20) + ' FİNALİ FETHEDİLDİ! 🏆';
  } else if(isHard(currentLevel)){
    t = '🔥 ZOR BÖLÜM ' + currentLevel + ' TAMAMLANDI!';
  } else {
    t = 'BÖLÜM ' + currentLevel + ' TAMAMLANDI! 🏆';
  }
  document.getElementById('doneTitle').textContent = t;
  const nextBtn = document.getElementById('btnNext');
  nextBtn.style.display = currentLevel < TOTAL_LEVELS ? '' : 'none';
  showScreen('lvlDone');
}

// --- buton bağlantıları ---
document.getElementById('btnPlay').addEventListener('click', ()=>{
  buildLevelInfo(); showScreen('levels');
});
document.getElementById('btnShop').addEventListener('click', ()=>{ buildShop(); showScreen('shop'); });
document.getElementById('btnShopBack').addEventListener('click', ()=> showScreen('menu'));
document.getElementById('btnTeam').addEventListener('click', ()=>{ buildTeamGrid(); showScreen('teamSel'); });
document.getElementById('btnSettings').addEventListener('click', ()=> showScreen('settings'));
document.getElementById('btnLvlBack').addEventListener('click', ()=> showScreen('menu'));
document.getElementById('btnSetBack').addEventListener('click', ()=> showScreen('menu'));
document.getElementById('btnHome').addEventListener('click', ()=> showScreen('menu'));
document.getElementById('btnNext').addEventListener('click', ()=> startLevel(Math.min(currentLevel+1, TOTAL_LEVELS)));
document.getElementById('btnReplay').addEventListener('click', ()=> startLevel(currentLevel));
document.getElementById('btnDoneMenu').addEventListener('click', ()=> showScreen('menu'));

// --- ayar düğmeleri (döngülü) ---
const KEEPER_OPTS = [ {label:'KOLAY', v:0.75}, {label:'NORMAL', v:1}, {label:'ZOR', v:1.3} ];
const BALL_OPTS   = [ {label:'YAVAŞ', v:0.85}, {label:'NORMAL', v:1}, {label:'HIZLI', v:1.15} ];
let keeperIdx = 1, ballIdx = 1;
document.getElementById('setKeeper').addEventListener('click', function(){
  keeperIdx = (keeperIdx+1) % KEEPER_OPTS.length;
  settings.keeper = KEEPER_OPTS[keeperIdx].v;
  this.textContent = KEEPER_OPTS[keeperIdx].label;
  saveGame();
});
document.getElementById('setBall').addEventListener('click', function(){
  ballIdx = (ballIdx+1) % BALL_OPTS.length;
  settings.ball = BALL_OPTS[ballIdx].v;
  this.textContent = BALL_OPTS[ballIdx].label;
  saveGame();
});
document.getElementById('setVib').addEventListener('click', function(){
  settings.vib = !settings.vib;
  this.textContent = settings.vib ? 'AÇIK' : 'KAPALI';
  saveGame();
});

// ---------------- BAŞLAT ----------------
const hasSave = loadGame();
applyTeam(myTeam);
document.getElementById('tokVal').textContent = tokens;
document.getElementById('setKeeper').textContent = KEEPER_OPTS[keeperIdx].label;
document.getElementById('setBall').textContent = BALL_OPTS[ballIdx].label;
document.getElementById('setVib').textContent = settings.vib ? 'AÇIK' : 'KAPALI';
updGoalHud();
buildScenario();       // menünün arkasında saha hazır dursun
buildTeamGrid();
state = 'MENU';
showScreen(hasSave ? 'menu' : 'teamSel'); // kayıt varsa direkt menü — kaldığın yerden!

requestAnimationFrame(loop);
})();
</script>
